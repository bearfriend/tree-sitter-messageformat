[package]
name = "tree-sitter-messageformat"
description = "messageformat parser"
version = "0.2.0"
authors = ["Danny Gleckler <daniel.gleckler@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "messageformat"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/bearfriend/tree-sitter-messageformat"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "message/grammar.js",
  "message/src/*",
  "message/queries/*",
  "tree-sitter.json",
  "LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1.9"

[build-dependencies]
cc = "1.8"

[dev-dependencies]
tree-sitter = "0.27.1"
streaming-iterator = "0.1"
# Host languages used to test the injection queries in `injections/`.
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-swift = "0.7.4"
tree-sitter-typescript = "0.23.2"
