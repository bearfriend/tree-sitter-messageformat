name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Generated parser is up to date
        run: |
          npm run generate
          git diff --exit-code -- src message/src

      - name: Corpus and highlight tests
        run: npx tree-sitter test

      - name: Message grammar corpus tests
        run: npm run test:message

      - name: Node binding tests
        run: node --test bindings/node/*_test.js

      - name: Rust binding and injection query tests
        run: cargo test
